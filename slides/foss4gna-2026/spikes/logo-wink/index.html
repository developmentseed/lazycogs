<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lazycogs logo wink spike</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #202020; background: #f6f4f1; }
    body { max-width: 58rem; margin: 3rem auto; padding: 0 1.5rem; }
    h1 { font-size: 1.25rem; font-weight: 600; }
    .preview { display: grid; place-items: center; min-height: 22rem; background: white; border: 1px solid #ddd; }
    svg { width: 18rem; height: 18rem; }
    .open-eye { opacity: 0; }
    .closed-eye { opacity: 1; }
    .logo.is-wink .right-eye .closed-eye { animation: close 1.8s both; }
    .logo.is-wink .right-eye .open-eye { animation: open 1.8s both; }
    .logo.is-static-wink .right-eye .closed-eye { opacity: 0; }
    .logo.is-static-wink .right-eye .open-eye { opacity: 1; }
    @keyframes close { 0%, 18%, 42%, 100% { opacity: 1; } 28%, 35% { opacity: 0; } }
    @keyframes open { 0%, 18%, 42%, 100% { opacity: 0; } 28%, 35% { opacity: 1; } }
    .controls { display: flex; align-items: center; gap: .75rem; margin-top: 1rem; }
    button { padding: .5rem .8rem; font: inherit; }
    #state { color: #555; }
    @media (prefers-reduced-motion: reduce) {
      .logo.is-wink .right-eye .closed-eye, .logo.is-wink .right-eye .open-eye { animation: none; }
      .logo.is-wink .right-eye .closed-eye { opacity: 1; }
      .logo.is-wink .right-eye .open-eye { opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>Closing-logo wink · isolated visual spike</h1>
  <div class="preview">
    <svg id="logo" class="logo" viewBox="0 0 200 200" role="img" aria-label="lazycogs relaxed-cubes icon">
      <g transform="matrix(0.93327646,0,0,0.92351204,0.01535639,15.306394)" stroke-linecap="round" stroke-linejoin="round">
        <rect width="200" height="179.91104" fill="#fff" x="9.9951649" y="13.507717" />
        <g fill="#fff" stroke="#000" stroke-width="2.5">
          <path d="m 105.51036,172.27788 89.7784,-46.31713 -89.7784,-46.317146 -89.778397,46.317146 z" />
          <path d="M 105.51036,141.39979 195.28876,95.082658 105.51036,48.76551 15.731963,95.082658 Z" />
          <path d="m 105.51036,110.5217 89.7784,-46.317144 -89.7784,-46.31714 -89.778397,46.31714 z" />
        </g>
        <g fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M75.584226 59.572842 q10.474143 9.263429 20.948295 0" />
          <g class="right-eye">
            <path class="closed-eye" d="M114.4882 59.572842 q10.47415 9.263429 20.94829 0" />
            <path class="open-eye" d="M114.4882 59.572842 Q124.96235 46.8 135.43649 59.572842 Q124.96235 72.3 114.4882 59.572842 Z" fill="#fff" />
          </g>
          <path d="m 96.532521,75.011889 q 8.977839,9.263429 17.955679,0" />
        </g>
        <path d="m169.06752 40.491542 a8 7.1964415 0 1 0 0 14.392883 a8 7.1964415 0 1 1 0 -14.392883" fill="#000" />
      </g>
    </svg>
  </div>
  <div class="controls">
    <button id="replay" type="button">Replay one-shot</button>
    <span id="state" aria-live="polite">Resting mark</span>
  </div>
  <script>
    const logo = document.querySelector('#logo')
    const state = document.querySelector('#state')
    const replay = () => {
      logo.classList.remove('is-wink')
      void logo.getBoundingClientRect()
      logo.classList.add('is-wink')
      state.textContent = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'Reduced motion: resting mark' : 'One-shot: right eye opens briefly, then settles'
    }
    document.querySelector('#replay').addEventListener('click', replay)
    const stage = new URLSearchParams(location.search).get('stage')
    if (stage === 'wink') logo.classList.add('is-static-wink')
    if (!stage) setTimeout(replay, 600)
    if (stage === 'settled') state.textContent = 'Settled mark'
  </script>
</body>
</html>
