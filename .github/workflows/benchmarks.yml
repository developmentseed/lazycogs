name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark:
    outputs:
      report: ${{ steps.report.outcome }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2 # Include the first parent of the PR test merge.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57

      - name: Restore benchmark data cache
        uses: actions/cache@v5
        with:
          path: .benchmark_data
          key: benchmark-data-${{ hashFiles('scripts/prepare_benchmark_data.py') }}

      - name: Prepare benchmark data
        run: uv run --locked python scripts/prepare_benchmark_data.py

      - name: Run benchmarks
        env:
          PYTEST_ADDOPTS: >-
            --benchmark-enable --benchmark-min-rounds=3 --benchmark-max-time=5
            --benchmark-warmup=on --benchmark-warmup-iterations=1
            --benchmark-storage=${{ github.workspace }}/.benchmarks
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            uv run --locked pytest tests/benchmarks/ -v
          else
            git worktree add --detach "$RUNNER_TEMP/base" "$GITHUB_SHA^1"
            ln -s "$GITHUB_WORKSPACE/.benchmark_data" "$RUNNER_TEMP/base/.benchmark_data"
            (cd "$RUNNER_TEMP/base" && uv run --locked pytest tests/benchmarks/ --benchmark-save=main -v)
            uv run --locked pytest tests/benchmarks/ --benchmark-save="pr-$GITHUB_SHA" \
              --benchmark-compare='*_main' --benchmark-compare-fail=mean:20% -v
          fi

      - name: Summarize benchmark comparison
        id: report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          if ! compgen -G '.benchmarks/*/*_pr-*.json' > /dev/null; then
            echo 'Benchmark comparison unavailable; see the benchmark logs.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          uv run --locked python scripts/format_benchmark_comparison.py \
            --baseline '.benchmarks/**/*_main.json' --pr '.benchmarks/**/*_pr-*.json' > benchmark_report.md
          cat benchmark_report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: >-
          ${{ !cancelled() && steps.report.outcome == 'success' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          name: benchmark-report
          path: benchmark_report.md

  comment:
    needs: benchmark
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.benchmark.outputs.report == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-report

      - name: Update comparison comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- lazycogs-benchmark-comparison -->"))) | .id' | head -1)
          if [[ -n "$id" ]]; then
            gh api "repos/$REPO/issues/comments/$id" -X PATCH -F body=@benchmark_report.md
          else
            gh api "repos/$REPO/issues/$PR/comments" -X POST -F body=@benchmark_report.md
          fi
